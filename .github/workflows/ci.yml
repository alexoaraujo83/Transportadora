name: Fusion Cargas CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fusion_cargas_test
          POSTGRES_USER: fusion
          POSTGRES_PASSWORD: fusion123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django check
        run: python manage.py check --settings=config.test_settings
      - name: Migrations check
        run: python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - name: Run tests
        run: pytest
